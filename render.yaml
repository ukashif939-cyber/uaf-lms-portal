# Deploy API at https://uaf-lms-api.onrender.com (free tier)
# Dashboard: New → Blueprint → connect this GitHub repo
services:
  - type: web
    name: uaf-lms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node scripts/seed-demo.js
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: PORT
        value: "10000"
      - key: FIREBASE_PROJECT_ID
        value: uaf-lms-main
      - key: NODE_ENV
        value: production
